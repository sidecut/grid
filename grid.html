<style>
body, html {
  margin: 0;
  padding: 0;
  overflow: hidden;
  width: 100%;
  height: 100%;
}
canvas {
  display: block;
}
#helpScreen {
  box-sizing: border-box;
  width: 100%;
  height: 100%;
  padding: 40px;
  background: #fff;
  color: #111;
  font-family: Menlo, Monaco, Consolas, 'Courier New', monospace;
  line-height: 1.5;
  display: flex;
  align-items: center;
  justify-content: center;
}
#helpContent {
  max-width: 760px;
  width: 100%;
}
#helpContent h1 {
  margin: 0 0 16px;
  font-size: 28px;
}
#helpContent p {
  margin: 8px 0;
}
</style>
<body>
<canvas id="gridCanvas"></canvas>
<div id="helpScreen">
  <div id="helpContent">
    <h1>Grid Controls</h1>
    <p>Click, press H, or press Space to leave help mode.</p>
    <p>/ or ? : Show help mode</p>
    <p>w or g : Toggle white canvas / grid</p>
    <p>f : Toggle fullscreen</p>
    <p>p : Toggle full-width plus sign</p>
    <p>n : Set grid size</p>
    <p>+ or = : Increase grid size</p>
    <p>- : Decrease grid size</p>
  </div>
</div>
</body>
<script>
const canvas = document.getElementById('gridCanvas');
const ctx = canvas.getContext('2d');
const helpScreen = document.getElementById('helpScreen');
const settingsStorageKey = 'gridCanvasSettings';
let gridSize = 15; // Size of each grid square in pixels
const centerLineWidth = 4;

let showWhiteCanvas = false;
let plusIsFullWidth = true;
let isHelpMode = true;

function saveSettings() {
  const settings = {
    gridSize,
    showWhiteCanvas,
    plusIsFullWidth,
  };

  try {
    localStorage.setItem(settingsStorageKey, JSON.stringify(settings));
  } catch {
    // Ignore storage failures (private mode, blocked storage, etc.).
  }
}

function loadSettings() {
  try {
    const rawSettings = localStorage.getItem(settingsStorageKey);

    if (!rawSettings) {
      return;
    }

    const settings = JSON.parse(rawSettings);

    if (Number.isFinite(settings.gridSize) && settings.gridSize > 0) {
      gridSize = Math.max(2, Math.round(settings.gridSize));
    }

    if (typeof settings.showWhiteCanvas === 'boolean') {
      showWhiteCanvas = settings.showWhiteCanvas;
    }

    if (typeof settings.plusIsFullWidth === 'boolean') {
      plusIsFullWidth = settings.plusIsFullWidth;
    }
  } catch {
    // Ignore corrupt or inaccessible storage data.
  }
}

function setGridSize(nextSize) {
  const parsedSize = Number(nextSize);

  if (!Number.isFinite(parsedSize) || parsedSize <= 0) {
    return false;
  }

  gridSize = Math.max(2, Math.round(parsedSize));
  saveSettings();
  render();
  return true;
}

function toggleFullscreen() {
  const docEl = document.documentElement;

  if (!document.fullscreenElement) {
    if (docEl.requestFullscreen) {
      docEl.requestFullscreen().catch(() => {
        // Ignore fullscreen errors that can happen on unsupported environments.
      });
    } else if (docEl.webkitRequestFullscreen) {
      docEl.webkitRequestFullscreen();
    }
    return;
  }

  if (document.exitFullscreen) {
    document.exitFullscreen().catch(() => {
      // Ignore fullscreen errors that can happen on unsupported environments.
    });
  } else if (document.webkitExitFullscreen) {
    document.webkitExitFullscreen();
  }
}

function drawGrid() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const centerX = canvas.width / 2;
  const centerY = canvas.height / 2;

  if (showWhiteCanvas) {
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  } else {
    ctx.strokeStyle = '#333'; // Grid line color
    ctx.lineWidth = 1;
    ctx.beginPath();

    // Draw vertical lines outward from the exact canvas center.
    for (let x = centerX; x <= canvas.width; x += gridSize) {
      ctx.moveTo(x, 0);
      ctx.lineTo(x, canvas.height);
    }
    for (let x = centerX - gridSize; x >= 0; x -= gridSize) {
      ctx.moveTo(x, 0);
      ctx.lineTo(x, canvas.height);
    }

    // Draw horizontal lines outward from the exact canvas center.
    for (let y = centerY; y <= canvas.height; y += gridSize) {
      ctx.moveTo(0, y);
      ctx.lineTo(canvas.width, y);
    }
    for (let y = centerY - gridSize; y >= 0; y -= gridSize) {
      ctx.moveTo(0, y);
      ctx.lineTo(canvas.width, y);
    }

    ctx.stroke();
  }

  // Draw a thicker plus sign at the exact canvas center.
  ctx.strokeStyle = '#333';
  ctx.beginPath();
  ctx.lineWidth = centerLineWidth;

  if (plusIsFullWidth) {
    ctx.moveTo(centerX, 0);
    ctx.lineTo(centerX, canvas.height);
    ctx.moveTo(0, centerY);
    ctx.lineTo(canvas.width, centerY);
  } else {
    ctx.moveTo(centerX, centerY - gridSize);
    ctx.lineTo(centerX, centerY + gridSize);
    ctx.moveTo(centerX - gridSize, centerY);
    ctx.lineTo(centerX + gridSize, centerY);
  }

  ctx.stroke();
}

function render() {
  if (isHelpMode) {
    canvas.style.display = 'none';
    helpScreen.style.display = 'flex';
    return;
  }

  helpScreen.style.display = 'none';
  canvas.style.display = 'block';
  drawGrid();
}

function exitHelpMode() {
  if (!isHelpMode) {
    return;
  }

  isHelpMode = false;
  render();
}

function handleClick() {
  exitHelpMode();
}

function handleKeydown(event) {
  if (event.metaKey || event.ctrlKey || event.altKey) {
    return;
  }

  const isSpace = event.key === ' ' || event.key === 'Spacebar';

  if (isHelpMode) {
    if (event.key === 'h' || event.key === 'H' || isSpace) {
      event.preventDefault();
      exitHelpMode();
    }
    return;
  }

  if (event.key === '/' || event.key === '?') {
    event.preventDefault();
    isHelpMode = true;
    render();
    return;
  }

  if (event.key === 'w' || event.key === 'W' || event.key === 'g' || event.key === 'G') {
    showWhiteCanvas = !showWhiteCanvas;
    saveSettings();
    render();
    return;
  }

  if (event.key === 'f' || event.key === 'F') {
    toggleFullscreen();
    return;
  }

  if (event.key === 'p' || event.key === 'P') {
    plusIsFullWidth = !plusIsFullWidth;
    saveSettings();
    render();
    return;
  }

  if (event.key === 'n' || event.key === 'N') {
    const input = prompt('Enter grid size in pixels:', String(gridSize));

    if (input === null) {
      return;
    }

    if (!setGridSize(input)) {
      alert('Grid size must be a positive number.');
    }
    return;
  }

  if (event.key === '+' || event.key === '=') {
    setGridSize(gridSize + 1);
    return;
  }

  if (event.key === '-') {
    setGridSize(gridSize - 1);
  }
}

window.addEventListener('resize', render);
document.addEventListener('click', handleClick);
document.addEventListener('keydown', handleKeydown);
loadSettings();
render();
</script>
